name: OneBlockRace
version: '1.0'
main: eu.felixtpg.oneBlockRace.Main
api-version: '1.21'
load: STARTUP
authors:
  - FelixTPG
  - FrinshHD

commands:
  start:
  event:
    description: Event-Verwaltung
    usage: /event <setup|start|stop>
    permission: oneblockrace.event

permissions:
  oneblockrace.event:
    description: Erlaubt die Verwendung des Event-Befehls
    default: op
  oneblockrace.start:
    description: Erlaubt die Verwendung des Start-Befehls
    default: op